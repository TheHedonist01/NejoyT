[project]
name = "nerdearla-live-subtitles"
version = "0.1.0"
description = "Transcripción y traducción simultánea open source para conferencias con Gemini Live"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "websockets>=14.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
]

[tool.uv]
package = false
