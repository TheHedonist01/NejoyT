<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NejoyT — Subtitulado Nerdearla 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --badge-online: #10b981;
      --warning: #ffab00;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .top-nav {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1.5rem;
    }

    .top-nav a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .top-nav a:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    header {
      text-align: center;
      max-width: 700px;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #fff 40%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      gap: 1.25rem;
    }

    .room-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .room-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .room-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      letter-spacing: 0.04em;
    }

    .status-indicator.active {
      color: var(--badge-online);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-indicator.starting, .status-indicator.degraded {
      color: var(--warning);
      background: rgba(255, 171, 0, 0.12);
      border: 1px solid rgba(255, 171, 0, 0.3);
    }

    .status-indicator.stopped {
      color: var(--text-muted);
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .status-indicator.error {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-indicator.active .status-dot {
      background-color: var(--badge-online);
      box-shadow: 0 0 8px var(--badge-online);
      animation: pulse 1.5s infinite;
    }

    .status-indicator.starting .status-dot, .status-indicator.degraded .status-dot {
      background-color: var(--warning);
    }

    .status-indicator.stopped .status-dot {
      background-color: var(--text-muted);
    }

    .status-indicator.error .status-dot {
      background-color: var(--danger);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .room-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .tag {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .room-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #0b0f19;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="/admin">⚙ Panel de Operador / Admin</a>
  </div>

  <header>
    <div class="badge">Nerdearla 2026 · Vibeathon</div>
    <h1>NejoyT Subtítulos</h1>
    <p class="subtitle">Transcripción continua y traducción simultánea de conferencias técnicas en tiempo real con Gemini 3.5 Live.</p>
  </header>

  <main class="container" id="rooms-list">
    <div style="text-align: center; padding: 2rem; color: var(--text-muted);">
      Cargando salas del evento...
    </div>
  </main>

  <footer>
    Desarrollado para Nerdearla 2026 · Licencia Apache 2.0
  </footer>

  <script>
    async function loadRooms() {
      try {
        const res = await fetch('/api/rooms');
        const data = await res.json();
        const container = document.getElementById('rooms-list');

        if (!data.rooms || data.rooms.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">No hay salas configuradas actualmente.</div>';
          return;
        }

        container.innerHTML = data.rooms.map(room => {
          let stateClass = 'stopped';
          let stateLabel = 'STANDBY';

          if (room.state === 'active') {
            stateClass = 'active';
            stateLabel = 'EN VIVO';
          } else if (room.state === 'starting') {
            stateClass = 'starting';
            stateLabel = 'INICIANDO';
          } else if (room.state === 'degraded') {
            stateClass = 'degraded';
            stateLabel = 'RECONECTANDO';
          } else if (room.state === 'error') {
            stateClass = 'error';
            stateLabel = 'ERROR';
          }

          return `
            <article class="room-card">
              <div class="room-header">
                <h2 class="room-title">${room.name}</h2>
                <div class="status-indicator ${stateClass}">
                  <span class="status-dot"></span>
                  <span>${stateLabel}</span>
                </div>
              </div>
              <div class="room-meta">
                <span class="tag">Fuente: <strong>${room.kind.toUpperCase()}</strong></span>
                <span class="tag">Origen: <strong>${room.source_lang.toUpperCase()}</strong></span>
                <span class="tag">Destinos: <strong>${room.target_langs.join(', ').toUpperCase()}</strong></span>
                <span class="tag">Audiencia: <strong>${room.subscribers}</strong></span>
                <span class="tag">Frases: <strong>${room.subtitles_count}</strong></span>
              </div>
              <div class="room-actions">
                <a href="/room/${room.id}" class="btn btn-primary">Abrir Subtítulos</a>
                <a href="/room/${room.id}?overlay=1" target="_blank" class="btn btn-secondary">Overlay OBS</a>
                <a href="/api/rooms/${room.id}/export?format=srt" class="btn btn-secondary">Descargar SRT</a>
              </div>
            </article>
          `;
        }).join('');
      } catch (err) {
        console.error("Error cargando salas:", err);
      }
    }

    loadRooms();
    setInterval(loadRooms, 3000);
  </script>
</body>
</html>
