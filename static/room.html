<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtítulos en Vivo — NejoyT</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-interim: #94a3b8;
      --text-time: #64748b;
      --warning: #ffab00;
      --danger: #ef4444;
      --success: #10b981;
      --font-size: 1.5rem;
      --line-height: 1.6;
    }

    body.high-contrast {
      --bg: #000000;
      --card-bg: #000000;
      --border: #ffff00;
      --primary: #ffff00;
      --text: #ffff00;
      --text-interim: #ffffff;
      --text-time: #aaaaaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* BARRA SUPERIOR */
    header.toolbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
    }

    .room-name {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    select, button {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    select:hover, button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--primary);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.7rem;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-badge.starting, .status-badge.degraded {
      background: rgba(255, 171, 0, 0.15);
      color: var(--warning);
      border-color: rgba(255, 171, 0, 0.3);
    }

    .status-badge.error, .status-badge.disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* BANNER DE ESTADO INFORMATIVO */
    #status-banner {
      display: none;
      padding: 1rem 1.5rem;
      background: rgba(255, 171, 0, 0.1);
      border-bottom: 1px solid rgba(255, 171, 0, 0.3);
      color: var(--warning);
      text-align: center;
      font-size: 0.95rem;
    }

    /* CONTENEDOR DE SUBTÍTULOS */
    main.subtitles-container {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .standby-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: auto 0;
      padding: 4rem 1rem;
      color: var(--text-interim);
    }

    .standby-placeholder h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .subtitle-block {
      font-size: var(--font-size);
      line-height: var(--line-height);
      animation: fadeIn 0.25s ease-out;
      word-break: break-word;
    }

    .subtitle-final {
      color: var(--text);
      font-weight: 500;
    }

    .subtitle-interim {
      color: var(--text-interim);
      font-style: italic;
      opacity: 0.85;
      border-left: 3px solid var(--primary);
      padding-left: 0.75rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* MODO OVERLAY PARA OBS (?overlay=1) */
    body.overlay-mode {
      background: transparent !important;
      overflow: hidden;
    }

    body.overlay-mode header.toolbar,
    body.overlay-mode #status-banner,
    body.overlay-mode .standby-placeholder {
      display: none !important;
    }

    body.overlay-mode main.subtitles-container {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      right: 2rem;
      max-width: none;
      padding: 0;
      justify-content: flex-end;
    }

    body.overlay-mode .subtitle-block {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 10px;
      padding: 0.8rem 1.4rem;
      text-shadow: 2px 2px 5px #000, -2px -2px 5px #000, 2px -2px 5px #000, -2px 2px 5px #000;
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
      border-left: 6px solid #38bdf8;
    }

    body.overlay-mode .subtitle-interim {
      color: #cbd5e1;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <header class="toolbar" id="toolbar">
    <div class="brand">
      <a href="/">← Salas</a>
      <span class="room-name" id="room-title">Cargando sala...</span>
    </div>

    <div class="controls">
      <label for="lang-select" style="font-size: 0.85rem; color: var(--text-interim);">Idioma:</label>
      <select id="lang-select">
        <option value="es" selected>Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>

      <button id="font-dec" title="Reducir fuente">A-</button>
      <button id="font-inc" title="Aumentar fuente">A+</button>
      <button id="contrast-toggle" title="Modo Alto Contraste">Alto Contraste</button>

      <div class="status-badge" id="status-badge">
        <span id="status-text">Conectando...</span>
      </div>
    </div>
  </header>

  <div id="status-banner"></div>

  <main class="subtitles-container" id="subtitles">
    <div id="standby-msg" class="standby-placeholder" style="display: none;">
      <h2>Sala en Espera (Standby)</h2>
      <p>La charla aún no ha comenzado. Los subtítulos aparecerán automáticamente aquí en cuanto inicie el orador.</p>
    </div>

    <!-- Subtítulos finalizados -->
    <div id="final-subtitles"></div>
    <!-- Subtítulo interino en vivo -->
    <div id="interim-subtitle" class="subtitle-block subtitle-interim" style="display: none;"></div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isOverlay = urlParams.get('overlay') === '1';
    const roomId = window.location.pathname.split('/').pop() || 'auditorio-principal';

    if (isOverlay) {
      document.body.classList.add('overlay-mode');
    }

    let fontSize = 1.5;
    const fontIncBtn = document.getElementById('font-inc');
    const fontDecBtn = document.getElementById('font-dec');
    const contrastBtn = document.getElementById('contrast-toggle');
    const langSelect = document.getElementById('lang-select');
    const interimEl = document.getElementById('interim-subtitle');
    const finalContainer = document.getElementById('final-subtitles');
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const statusBanner = document.getElementById('status-banner');
    const standbyMsg = document.getElementById('standby-msg');

    fontIncBtn.addEventListener('click', () => {
      fontSize = Math.min(fontSize + 0.25, 3.0);
      document.documentElement.style.setProperty('--font-size', fontSize + 'rem');
    });

    fontDecBtn.addEventListener('click', () => {
      fontSize = Math.max(fontSize - 0.25, 1.0);
      document.documentElement.style.setProperty('--font-size', fontSize + 'rem');
    });

    contrastBtn.addEventListener('click', () => {
      document.body.classList.toggle('high-contrast');
    });

    // Auto-scroll
    let userScrolled = false;
    window.addEventListener('scroll', () => {
      const scrollPos = window.innerHeight + window.scrollY;
      const threshold = document.body.offsetHeight - 120;
      userScrolled = scrollPos < threshold;
    });

    function scrollToBottom() {
      if (!userScrolled) {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }

    function updateRoomStateUI(state, reason = "") {
      statusBadge.className = 'status-badge';
      statusBanner.style.display = 'none';

      if (state === 'active') {
        statusBadge.classList.add('active');
        statusText.textContent = '● EN VIVO';
        standbyMsg.style.display = 'none';
      } else if (state === 'starting') {
        statusBadge.classList.add('starting');
        statusText.textContent = '◌ INICIANDO...';
        standbyMsg.style.display = finalContainer.children.length === 0 ? 'flex' : 'none';
      } else if (state === 'degraded') {
        statusBadge.classList.add('degraded');
        statusText.textContent = '⚠ RECONECTANDO';
        statusBanner.style.display = 'block';
        statusBanner.textContent = 'Reconectando fuente de audio... La transcripción se retoma en breve.';
      } else if (state === 'stopped') {
        statusBadge.textContent = '■ EN ESPERA';
        if (finalContainer.children.length === 0) {
          standbyMsg.style.display = 'flex';
        }
      } else if (state === 'error') {
        statusBadge.classList.add('error');
        statusText.textContent = '✕ ERROR';
        statusBanner.style.display = 'block';
        statusBanner.textContent = reason || 'La sala experimentó un error.';
      }
    }

    // WebSocket conexión
    let ws = null;
    let selectedLang = langSelect.value;

    langSelect.addEventListener('change', () => {
      selectedLang = langSelect.value;
      connectWebSocket();
    });

    function connectWebSocket() {
      if (ws) {
        ws.close();
      }

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/${roomId}?lang=${selectedLang}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        // Al conectar por ws, consultamos el estado real
        fetchRoomInfo();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.event_type === 'status') {
            const st = data.metadata ? data.metadata.status : 'active';
            const reason = data.metadata ? data.metadata.reason : '';
            updateRoomStateUI(st, reason);
            return;
          }

          if (data.event_type === 'interim') {
            standbyMsg.style.display = 'none';
            interimEl.textContent = data.text;
            interimEl.style.display = 'block';
            scrollToBottom();
          } 
          else if (data.event_type === 'final' || data.event_type === 'translation') {
            standbyMsg.style.display = 'none';
            const isRelevant = 
              (selectedLang === data.language) ||
              (data.event_type === 'final' && selectedLang === 'en' && data.language.startsWith('en')) ||
              (data.event_type === 'final' && selectedLang === 'es' && data.language.startsWith('es')) ||
              (data.event_type === 'final' && selectedLang === 'pt' && data.language.startsWith('pt'));

            if (isRelevant || !data.language) {
              interimEl.style.display = 'none';
              interimEl.textContent = '';

              const p = document.createElement('div');
              p.className = 'subtitle-block subtitle-final';
              p.textContent = data.text;
              finalContainer.appendChild(p);

              if (finalContainer.children.length > 50) {
                finalContainer.removeChild(finalContainer.firstChild);
              }
              scrollToBottom();
            }
          }
        } catch (e) {
          console.error("Error parseando evento WebSocket:", e);
        }
      };

      ws.onclose = () => {
        statusBadge.className = 'status-badge disconnected';
        statusText.textContent = 'Desconectado';
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = (err) => {
        console.error("WebSocket error:", err);
        ws.close();
      };
    }

    // Cargar metadata de la sala
    async function fetchRoomInfo() {
      try {
        const res = await fetch('/api/rooms');
        if (!res.ok) return;
        const data = await res.json();
        const current = data.rooms.find(r => r.id === roomId);
        if (current) {
          document.getElementById('room-title').textContent = current.name;
          document.title = `${current.name} — Subtítulos Nerdearla`;
          updateRoomStateUI(current.state);

          // Ajustar idiomas disponibles en el selector
          if (current.target_langs && current.target_langs.length > 0) {
            const currentSelected = langSelect.value;
            const langNames = { 'es': 'Español', 'en': 'English', 'pt': 'Português' };
            langSelect.innerHTML = current.target_langs.map(l => `
              <option value="${l}" ${l === currentSelected ? 'selected' : ''}>${langNames[l] || l.toUpperCase()}</option>
            `).join('');
          }
        }
      } catch (err) {
        console.error("Error al obtener info de la sala:", err);
      }
    }

    fetchRoomInfo();
    connectWebSocket();
    setInterval(fetchRoomInfo, 5000);
  </script>
</body>
</html>
